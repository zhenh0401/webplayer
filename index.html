<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wallpaper"></div>

  <div class="window">
    <div class="titlebar">
      <span class="title">🎵 webplayer</span>
      <div class="buttons">
        <button class="win-btn min">–</button>
        <button class="win-btn max">▢</button>
        <button class="win-btn close">✕</button>
      </div>
    </div>

    <div class="content">
      <div class="toolbar">
        <input id="search" type="text" placeholder="Search songs...">
        <button id="shuffle">🔀 Shuffle</button>
        <button id="import-btn">📂 Import</button>
        <input id="file-input" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.opus,.webm" multiple hidden>
      </div>

      <div id="dropzone" class="dropzone">
        <div class="dropzone-inner">
          <div class="dropzone-icon">📂</div>
          <div class="dropzone-text">Drag & drop audio files here</div>
          <div class="dropzone-sub">or click "Import" above · MP3 · WAV · OGG · FLAC · M4A · AAC · OPUS</div>
        </div>
      </div>

      <div id="playlist" class="playlist"></div>

      <div class="nowplaying">
        <div class="np-main">
          <div class="cover-wrap">
            <div id="cover-big" class="cover cover-fallback">🎵</div>
          </div>

          <div class="np-info">
            <div id="np-title" class="np-title">Nothing playing</div>
            <div id="np-artist" class="np-artist"></div>

            <div class="progress-row">
              <span id="time-current" class="time">0:00</span>
              <div id="progress" class="progress">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <span id="time-total" class="time">0:00</span>
            </div>

            <div class="controls">
              <button id="prev" class="ctrl-btn" title="Previous">⏮</button>
              <button id="playpause" class="ctrl-btn play" title="Play / Pause">▶</button>
              <button id="next" class="ctrl-btn" title="Next">⏭</button>
              <button id="stop" class="ctrl-btn" title="Stop">⏹</button>
              <div class="volume-group">
                <span class="vol-icon" id="vol-icon">🔊</span>
                <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
              </div>
            </div>
          </div>
        </div>

        <audio id="player"></audio>
      </div>
    </div>
  </div>

  <script>
    /* ---------- Built-in songs ---------- */
    const songs = [
      { title: "Waltzing Flutes (Remastered)",               artist: "", file: "song1.mp3"  },
      { title: "Convenience Store",                          artist: "", file: "song2.mp3"  },
      { title: "School Crush",                               artist: "", file: "song3.mp3"  },
      { title: "So Easy (To Fall In Love)",                  artist: "", file: "song4.mp3"  },
      { title: "Run It Back",                                artist: "", file: "song5.mp3"  },
      { title: "Gypsy Woman In Brazil",                      artist: "", file: "song6.mp3"  },
      { title: "Has To Be (New Wave)",                       artist: "", file: "song7.mp3"  },
      { title: "New Look",                                   artist: "", file: "song8.mp3"  },
      { title: "Lotus Water Remake",                         artist: "", file: "song9.mp3"  },
      { title: "Lease But Slightly Bitcrushed For Nostalgia",artist: "", file: "song10.mp3" },
      { title: "Dating Start!",                              artist: "", file: "song11.mp3" },
      { title: "Snowdin Town",                               artist: "", file: "song12.mp3" },
      { title: "Lucy",                                       artist: "", file: "song13.mp3" },
      { title: "NO SIGNAL",                                  artist: "", file: "song14.mp3" },
      { title: "TICTAC",                                     artist: "", file: "song15.mp3" },
      { title: "Brooklynbloodpop X Vacation Bible School",   artist: "", file: "song16.mp3" },
      { title: "She Buggin X New Jeans",                     artist: "", file: "song17.mp3" },
      { title: "Good Day Commander",                         artist: "", file: "song18.mp3" },
    ];

    let queue = [...songs];
    let currentIndex = -1;

    const playlist    = document.getElementById('playlist');
    const player      = document.getElementById('player');
    const search      = document.getElementById('search');
    const npTitle     = document.getElementById('np-title');
    const npArtist    = document.getElementById('np-artist');
    const coverBig    = document.getElementById('cover-big');
    const playPauseBtn= document.getElementById('playpause');
    const prevBtn     = document.getElementById('prev');
    const nextBtn     = document.getElementById('next');
    const stopBtn     = document.getElementById('stop');
    const progress    = document.getElementById('progress');
    const progressFill= document.getElementById('progress-fill');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal   = document.getElementById('time-total');
    const volume      = document.getElementById('volume');
    const volIcon     = document.getElementById('vol-icon');
    const importBtn   = document.getElementById('import-btn');
    const fileInput   = document.getElementById('file-input');
    const dropzone    = document.getElementById('dropzone');

    /* ---------- FNV-1a hash ---------- */
    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    /* ---------- mulberry32 PRNG ---------- */
    function seededRandoms(seed, count) {
      const out = [];
      let s = seed >>> 0;
      for (let i = 0; i < count; i++) {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), 1 | t);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        out.push(((t ^ (t >>> 14)) >>> 0) / 4294967296);
      }
      return out;
    }

    /* ---------- Full-wheel gradient per title ---------- */
    function gradientFor(title) {
      const seed = hashString(title);
      const [r1, r2, r3, r4, r5, r6] = seededRandoms(seed, 6);

      const hue1 = Math.floor(r1 * 360);
      const hue2 = (hue1 + 90 + Math.floor(r2 * 180)) % 360;

      const sat1 = 65 + Math.floor(r3 * 25);
      const sat2 = 55 + Math.floor(r4 * 30);
      const light1 = 55 + Math.floor(r5 * 15);
      const light2 = 30 + Math.floor(r6 * 25);

      return `linear-gradient(135deg,
        hsl(${hue1}, ${sat1}%, ${light1}%) 0%,
        hsl(${hue2}, ${sat2}%, ${light2}%) 100%)`;
    }

    function applyGradient(el, title, label) {
      el.style.background = gradientFor(title);
      if (label !== undefined) {
        el.textContent = label;
      } else {
        const n = title.match(/\d+/);
        el.textContent = n ? n[0] : title.trim().charAt(0).toUpperCase() || '🎵';
      }
    }

    /* ---------- Rendering ---------- */
    function render(list) {
      playlist.innerHTML = '';
      list.forEach(song => {
        const row = document.createElement('div');
        row.className = 'song';

        const cover = document.createElement('div');
        cover.className = 'song-cover';
        if (song.local) {
          applyGradient(cover, song.title);
        } else {
          applyGradient(cover, song.title, songs.indexOf(song) + 1);
        }

        const meta = document.createElement('div');
        meta.className = 'song-meta';
        meta.innerHTML = `<div class="song-title">${escapeHtml(song.title)}</div>
                          <div class="song-artist">${escapeHtml(song.artist || '')}</div>`;

        row.appendChild(cover);
        row.appendChild(meta);
        row.onclick = () => play(song);
        playlist.appendChild(row);
      });
      highlightCurrent();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function highlightCurrent() {
      const current = queue[currentIndex];
      document.querySelectorAll('.song').forEach(d => {
        const t = d.querySelector('.song-title')?.textContent;
        d.classList.toggle('playing', current && t === current.title);
      });
    }

    /* ---------- Playback ---------- */
    function play(song) {
      const idx = queue.findIndex(s => s.file === song.file);
      if (idx === -1) return;

      currentIndex = idx;

      player.pause();
      player.removeAttribute('src');
      player.load();

      player.src = song.file;

      npTitle.textContent = song.title;
      npArtist.textContent = song.artist || '';
      if (song.local) {
        applyGradient(coverBig, song.title);
      } else {
        applyGradient(coverBig, song.title, songs.indexOf(song) + 1);
      }
      highlightCurrent();

      const attempt = player.play();
      if (attempt && typeof attempt.catch === 'function') {
        attempt.catch(err => {
          console.warn('Playback blocked or failed:', err);
          playPauseBtn.textContent = '▶';
        });
      }
    }

    function playByIndex(i) { if (i >= 0 && i < queue.length) play(queue[i]); }
    function togglePlayPause() {
      if (!player.src) { if (queue.length) playByIndex(0); return; }
      player.paused ? player.play() : player.pause();
    }
    function stop() {
      player.pause(); player.currentTime = 0;
      progressFill.style.width = '0%';
      timeCurrent.textContent = '0:00';
    }

    playPauseBtn.onclick = togglePlayPause;
    prevBtn.onclick = () => {
      if (player.currentTime > 3) { player.currentTime = 0; return; }
      playByIndex(currentIndex - 1);
    };
    nextBtn.onclick = () => playByIndex(currentIndex + 1);
    stopBtn.onclick = stop;

    player.addEventListener('ended', () => {
      if (currentIndex + 1 < queue.length) playByIndex(currentIndex + 1);
    });

    player.addEventListener('error', () => {
      console.warn('Audio error on:', player.src);
      playPauseBtn.textContent = '▶';
    });

    player.addEventListener('play',  () => playPauseBtn.textContent = '⏸');
    player.addEventListener('pause', () => playPauseBtn.textContent = '▶');

    /* ---------- Progress ---------- */
    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const ss = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${ss}`;
    }
    player.addEventListener('timeupdate', () => {
      if (!player.duration) return;
      progressFill.style.width = (player.currentTime / player.duration * 100) + '%';
      timeCurrent.textContent = fmt(player.currentTime);
    });
    player.addEventListener('loadedmetadata', () => timeTotal.textContent = fmt(player.duration));
    progress.addEventListener('click', e => {
      if (!player.duration) return;
      const rect = progress.getBoundingClientRect();
      player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
    });

    /* ---------- Volume ---------- */
    volume.addEventListener('input', () => {
      player.volume = volume.value;
      localStorage.setItem('volume', volume.value);
      updateVolIcon();
    });
    function updateVolIcon() {
      const v = parseFloat(volume.value);
      volIcon.textContent = v === 0 ? '🔇' : v < 0.5 ? '🔉' : '🔊';
    }

    /* ---------- Search ---------- */
    search.oninput = () => {
      const q = search.value.toLowerCase();
      render(queue.filter(s =>
        s.title.toLowerCase().includes(q) ||
        (s.artist || '').toLowerCase().includes(q)
      ));
    };

    /* ---------- Shuffle ---------- */
    document.getElementById('shuffle').onclick = () => {
      queue = [...queue].sort(() => Math.random() - 0.5);
      render(queue);
      playByIndex(0);
    };

    /* ---------- Keyboard ---------- */
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space')      { e.preventDefault(); togglePlayPause(); }
      if (e.code === 'ArrowRight') { playByIndex(currentIndex + 1); }
      if (e.code === 'ArrowLeft')  { playByIndex(currentIndex - 1); }
      if (e.code === 'ArrowUp')    { e.preventDefault(); volume.value = Math.min(1, +volume.value + 0.05); player.volume = volume.value; updateVolIcon(); }
      if (e.code === 'ArrowDown')  { e.preventDefault(); volume.value = Math.max(0, +volume.value - 0.05); player.volume = volume.value; updateVolIcon(); }
    });

    /* ---------- IMPORT: click button ---------- */
    importBtn.onclick = () => fileInput.click();
    fileInput.onchange = e => handleFiles(e.target.files);

    /* ---------- IMPORT: drag & drop ---------- */
    ['dragenter','dragover'].forEach(ev =>
      dropzone.addEventListener(ev, e => {
        e.preventDefault();
        dropzone.classList.add('dragging');
      })
    );
    ['dragleave','drop'].forEach(ev =>
      dropzone.addEventListener(ev, e => {
        e.preventDefault();
        dropzone.classList.remove('dragging');
      })
    );
    dropzone.addEventListener('drop', e => {
      const files = e.dataTransfer?.files;
      if (files && files.length) handleFiles(files);
    });

    /* ---------- Handle imported files ---------- */
    let localCounter = 0;
    function handleFiles(fileList) {
      const files = [...fileList].filter(f =>
        f.type.startsWith('audio/') ||
        /\.(mp3|wav|ogg|oga|flac|m4a|aac|opus|webm)$/i.test(f.name)
      );
      if (!files.length) { alert('No audio files found in that selection.'); return; }

      files.forEach(f => {
        // Title = filename without extension
        const title = f.name.replace(/\.[^/.]+$/, '');
        const url = URL.createObjectURL(f);
        queue.push({
          title,
          artist: '',
          file: url,
          local: true
        });
        localCounter++;
      });

      render(queue);
      // Auto-play the first newly added track
      playByIndex(queue.length - files.length);
    }

    /* ---------- Restore volume ---------- */
    const savedVol = localStorage.getItem('volume');
    if (savedVol !== null) { volume.value = savedVol; player.volume = savedVol; }
    updateVolIcon();

    render(queue);
  </script>
</body>
</html>
